[package]
name = "imirror"
version = "5.0.1"
edition = "2021"
authors = ["Ernomoon <https://t.me/Ernomoon>"]
description = "iMirror - iPhone screen mirroring for Windows"
license = "GPL-3.0-or-later"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.34"
wry = "0.53"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock", "Win32_NetworkManagement_Dns", "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_UI_Shell",
  "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input",
  "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Com",
  "Win32_Security", "Win32_System_Power",
  "Foundation", "Foundation_Collections", "Devices_Bluetooth",
  "Devices_Bluetooth_GenericAttributeProfile", "Storage_Streams",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
