; iMirror Remote — ESP32 BLE HID bridge (keyboard + mouse + consumer keys) for iPhone.
; Build:  pio run            Flash:  pio run -e <env> -t upload
; Or simply use the "Прошить ESP32" button in the iMirror app (uses the prebuilt .bin files).

[env]
platform = espressif32@6.9.0
framework = arduino
lib_deps = h2zero/NimBLE-Arduino@1.4.3
monitor_speed = 115200
build_flags =
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; Classic ESP32 (ESP32-WROOM / DevKit V1, USB-UART chip CP2102/CH340)
[env:esp32]
board = esp32dev

; ESP32-S3 (native USB or USB-UART port — both work)
[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ESP32-C3 (SuperMini and similar boards with native USB)
[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
