name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  UXPLAY_COMMIT: 566f3460e3cbb16c2c33a7ac607d3d2d0dd09b14   # UxPlay 1.74, verified with receiver/patch_uxplay.py

jobs:
  linux:
    name: Tests, firmware, UI screenshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libplist-dev libssl-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav cmake ninja-build g++
      - name: Build patched UxPlay
        run: |
          git clone -q https://github.com/FDH2/UxPlay.git /tmp/UxPlay
          git -C /tmp/UxPlay checkout -q "$UXPLAY_COMMIT"
          python receiver/patch_uxplay.py /tmp/UxPlay
          cmake -S /tmp/UxPlay -B /tmp/UxPlay/build -G Ninja && ninja -C /tmp/UxPlay/build
      - run: pip install -q zeroconf ifaddr playwright
      - name: Unit tests
        run: python tests/test_all.py
      - name: Discovery end-to-end (announce -> browse like an iPhone -> GET /info)
        run: python tests/test_discovery.py /tmp/UxPlay/build/uxplay
      - name: UI screenshots
        run: python tests/ui_shots.py "$(which google-chrome)" shots
      - uses: actions/upload-artifact@v4
        with: { name: ui-screenshots, path: shots/ }

  windows:
    name: Windows build, tests and installer
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav

      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $base = (Get-Content VERSION -Raw).Trim()
          $publish = "false"
          if ($env:GITHUB_REF -eq "refs/heads/main") {
            gh release view "v$base" --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -ne 0) { $publish = "true" }
          }
          $global:LASTEXITCODE = 0
          if ($publish -eq "true") { $v = $base } else { $v = "$base-dev.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "publish=$publish" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v, publish release: $publish"

      - name: Fetch and patch UxPlay
        run: |
          git clone -q https://github.com/FDH2/UxPlay.git build/UxPlay
          git -C build/UxPlay checkout -q $env:UXPLAY_COMMIT
          python receiver/patch_uxplay.py build/UxPlay

      - name: Build UxPlay and bundle the receiver
        shell: msys2 {0}
        run: |
          cmake -S build/UxPlay -B build/UxPlay/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ninja -C build/UxPlay/build
          bash packaging/bundle_receiver.sh build/UxPlay/build/uxplay.exe dist-receiver

      - name: Python packages
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r app/requirements.txt pyinstaller

      - name: Receiver bundle works in isolation
        run: python packaging/verify_receiver.py dist-receiver

      - name: Unit tests on Windows
        run: python tests/test_all.py

      - name: Discovery end-to-end on Windows (no Bonjour, zeroconf path)
        run: python tests/test_discovery.py dist-receiver/bin/uxplay.exe

      - name: PyInstaller
        run: pyinstaller --noconfirm --distpath dist --workpath build/pyi packaging/imirror.spec

      - name: Self-test of the built app without Bonjour (starts receiver, must be announced)
        env:
          IMIRROR_SELFTEST_REQUIRE_MDNS: "1"
        run: |
          $env:APPDATA = "$PWD\appdata1"; $env:LOCALAPPDATA = "$PWD\appdata1"
          New-Item -ItemType Directory -Force appdata1 | Out-Null
          Copy-Item -Recurse dist-receiver dist/iMirror/receiver
          $p = Start-Process dist/iMirror/iMirror.exe -ArgumentList "--selftest" -WorkingDirectory $PWD -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process $p -Force; throw "self-test timed out" }
          Get-Content selftest-result.json
          Get-Content appdata1\iMirror\imirror.log -Tail 40
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          Remove-Item -Recurse dist/iMirror/receiver

      - name: Install Apple Bonjour (the user's setup)
        run: |
          Invoke-WebRequest -UseBasicParsing "https://download.info.apple.com/Mac_OS_X/061-8098.20100603.gthyu/BonjourPSSetup.exe" -OutFile BonjourPSSetup.exe
          $i = Start-Process .\BonjourPSSetup.exe -ArgumentList "/quiet","/norestart" -PassThru -Wait
          "Bonjour installer exit: $($i.ExitCode)"
          sc.exe query "Bonjour Service"
          Test-Path "$env:SystemRoot\System32\dnssd.dll"
          Get-Command dns-sd -ErrorAction SilentlyContinue | Format-List Source

      - name: Diagnostic - zeroconf while Bonjour owns port 5353
        continue-on-error: true
        timeout-minutes: 3
        env:
          IMIRROR_MDNS_METHOD: zeroconf
        run: python tests/test_discovery.py dist-receiver/bin/uxplay.exe

      - name: Discovery end-to-end with Bonjour (as on the user's PC)
        run: python tests/test_discovery.py dist-receiver/bin/uxplay.exe

      - name: Self-test of the built app with Bonjour
        env:
          IMIRROR_SELFTEST_REQUIRE_MDNS: "1"
        run: |
          $env:APPDATA = "$PWD\appdata2"; $env:LOCALAPPDATA = "$PWD\appdata2"
          New-Item -ItemType Directory -Force appdata2 | Out-Null
          Copy-Item -Recurse dist-receiver dist/iMirror/receiver
          $p = Start-Process dist/iMirror/iMirror.exe -ArgumentList "--selftest" -WorkingDirectory $PWD -PassThru
          if (-not $p.WaitForExit(180000)) { Stop-Process $p -Force; throw "self-test timed out" }
          Get-Content selftest-result.json
          Get-Content appdata2\iMirror\imirror.log -Tail 40
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          Remove-Item -Recurse dist/iMirror/receiver

      - name: Installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\imirror.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem dist\iMirror-Setup-*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Install silently and self-test the installed app
        run: |
          $setup = (Get-ChildItem dist\iMirror-Setup-*.exe)[0].FullName
          $i = Start-Process $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -PassThru -Wait
          if ($i.ExitCode -ne 0) { throw "installer exit $($i.ExitCode)" }
          $app = "$env:ProgramFiles\iMirror"
          foreach ($f in "iMirror.exe", "receiver\bin\uxplay.exe", "receiver\lib\gstreamer-1.0\libgstd3d11.dll") {
            if (-not (Test-Path "$app\$f")) { throw "missing after install: $f" }
          }
          netsh advfirewall firewall show rule name="iMirror AirPlay" | Select-String "Enabled|Program"
          New-Item -ItemType Directory -Force installed-test | Out-Null
          $p = Start-Process "$app\iMirror.exe" -ArgumentList "--selftest" -WorkingDirectory "$PWD\installed-test" -PassThru
          if (-not $p.WaitForExit(150000)) { Stop-Process $p -Force; throw "installed self-test timed out" }
          Get-Content installed-test\selftest-result.json
          if ($p.ExitCode -ne 0) { throw "installed self-test failed" }

      - name: Collect app logs
        if: always()
        run: |
          New-Item -ItemType Directory -Force applogs | Out-Null
          Copy-Item "$env:LOCALAPPDATA\iMirror\*.log", "$env:LOCALAPPDATA\iMirror\stacks.txt", "appdata1\iMirror\*", "appdata2\iMirror\*" applogs -ErrorAction SilentlyContinue
          Get-ChildItem applogs | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 80 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: |
            selftest-result.json
            selftest-ui.png
            installed-test/
            applogs/
      - uses: actions/upload-artifact@v4
        with:
          name: iMirror-Setup
          path: dist/iMirror-Setup-*.exe

      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: iMirror ${{ steps.ver.outputs.version }}
          files: dist/iMirror-Setup-*.exe
          make_latest: true
          body_path: packaging/release-notes.md
